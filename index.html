<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Flex-basis Property</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="wrapper">
        <h1>Thực hành thuộc tính <code>flex-basis</code></h1>

        <!-- Ví dụ 1: Sử dụng px -->
        <section>
            <h2>1. Ví dụ với đơn vị px</h2>
            <div class="container container-1">
                <div class="item item1">Item 1</div>
                <div class="item item2">Item 2</div>
                <div class="item item3">Item 3</div>
            </div>
        </section>

        <!-- Ví dụ 2: Thay đổi theo flex-direction: column -->
        <section>
            <h2>2. Ví dụ với flex-direction: column</h2>
            <div class="container container-2">
                <div class="item">Item 1</div>
                <div class="item">Item 2</div>
                <div class="item">Item 3</div>
            </div>
        </section>

        <!-- Ví dụ 3: Sử dụng phần trăm (%) -->
        <section>
            <h2>3. Ví dụ với đơn vị phần trăm (%)</h2>
            <div class="container container-3">
                <div class="item">Item 1</div>
                <div class="item">Item 2</div>
            </div>
        </section>

        <!-- Ví dụ 4: Kết hợp flex-basis với flex-grow -->
        <section>
            <h2>4. Kết hợp flex-basis với flex-grow</h2>
            <div class="container container-4">
                <div class="item fg-1">Item 1 (grow: 1)</div>
                <div class="item fg-2">Item 2 (grow: 2)</div>
                <div class="item fg-1">Item 3 (grow: 1)</div>
            </div>
        </section>
    </div>

</body>
</html>
