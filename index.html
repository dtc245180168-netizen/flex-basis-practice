<!DOCTYPE html>
<html lang="vi">

    <title>Thực hành Flex-wrap</title>

</head>
<body>

    <div class="wrapper">
        <h2>Bài thực hành thuộc tính Flex-wrap</h2>

        <!-- Container chứa các Flex Items -->
